<!DOCTYPE html> <!--это декларация, которая определяет наш документ как HTML5, не является тегом-->
<html lang="ru">  <!--является корневым элементом HTML страницы
  Язык документа указывается с помощью атрибута lang в теге <html>
  От языка зависит и правильная автоматическая расстановка переносов.
  От языка могут зависеть:
    результаты поиска, основанные на лингвистических предпочтениях пользователя;
    автоматические средства правописания и грамматики;
    автоматические переводчики;
    синтезаторы речи и переводчики Брайля-->

  <head>  <!--содержит мета-информацию об HTML документе, эти сведения не видны пользователю-->
    <!--Визуально отделяйте вложенные элементы двойным пробелом-->
    <meta charset="UTF-8" />
    <title>Название документа (страницы)</title>  <!--указывает название HTML документа,
                                                  оно обязательно и должно содержать важные ключевые слова,
                                                  чтобы поисковые системы могли включить вашу страницу в результаты поиска-->
  </head>

  <body>  <!--описывает видимое содержимое HTML страницы-->
    <h1>Заголовок страницы</h1> <!--определяет заголовок первого уровня на HTML странице-->
    <img src="images/logo.png" alt="logo" />  <!--одиночный тег и изображением-->
    <p title="подсказка для параграфа">параграф текста</p>  <!--В примере атрибут title добавлен к элементу <p>.
                                                            Значение атрибута title будет отображаться как всплывающая подсказка.
                                                            Атрибуты всегда задаются в начальном теге и обычно входят в пару имя/значение-->
    <p>Параграф текста</p>	<!--определяет абзац (параграф) в HTML документе-->

    <div class="article"> <!--блок <div> с атрибутом class, значение которого — article.
                          Это атрибут предназначен в первую очередь для стилевого оформления и объединения элементов с общими свойствами-->
      <h1>Основы HTML</h1>  <!--заголовок нашей статьи-->
      <p title="gfhfuhfa">  <!--параграф-->
        HTML - это <span style="color: red">язык разметки</span> документов во Всемирной паутине
      </p>
      <p title="жесть">
        Теги - это элементы, отвечающие за структуру HTML-документа <!--ЭТА Х ЧОМУ-ТО НЕ РАБОТАЕТ-->
      </p>
    </div>

    <!--В HTML5 введены такие семантические блочные элементы как:
	    <header>,	//задает «шапку» сайта или раздела веб-страницы. Может многократно использоваться на странице, не может быть вложен сам в себя
	    <main>,		//предназначен для основного содержимого документа.
                На странице может быть только один <main> и он не должен располагаться внутри элементов <header>, <footer>,
                <article>, <aside>, <nav> или <section>
	    <footer>, //задает «подвал» сайта или раздела веб-страницы. Также может использован многократно и не может быть вложен сам в себя
	    <nav>,		//задает навигацию по сайту. Обычно в него помещают приоритетные ссылки
	    <article>,	//представляет самостоятельную часть документа, страницы, приложения или сайта, предназначенную для независимого распространения или повторного использования — статья, запись в блоге, комментарий и даже карточка товара
	    <section>,	//задает автономный раздел документа, который, не является самостоятельным сам по себе, это часть другого крупного элемента.
                  Может быть использован для блока новостей, контактной информации и т.д. Разделы обычно содержат заголовок
	    <aside>.	//раздел страницы, который имеет косвенное отношение к содержимому страницы.
                Применяется для боковых панелей, рекламных блоков, сносок другой информации, которая отделена от основного содержимого страницы-->
    <span style="display:block; margin: 25px 0; font-size: 32px; font-weight: 700;">
      Ненастоящий заголовок <!--Как заголовок, не будет иметь никакого семантического значения и никогда не будет автоматически распознан как заголовок-->
    </span>

  </body>
</html>

                                или добавить непосредственно все файлы проекта).

-->
